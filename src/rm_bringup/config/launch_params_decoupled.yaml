# ============================================================
# SP aim_v2 启动总入口
# ============================================================
#
# 当前 v2 分支只保留 SP aim_v2 主链路：
#   video/camera -> /image_raw
#   virtual_serial/real_serial -> /serial/receive
#   aim_v2_node -> /armor_solver/cmd_gimbal
#
# 常用启动：
#   ros2 launch rm_bringup bringup_v2.launch.py
#
# 命令行参数可以覆盖这里的默认值，例如：
#   ros2 launch rm_bringup bringup_v2.launch.py image_source:=video virtual_serial:=true


# ============================================================
# 1. 运行模式
# ============================================================

# 车种配置。只在根目录没有同名 *_params.yaml 时作为 fallback 使用。
# 离线视频调试通常不用改；实车按车型选择 infantry_4_1 / hero / leg / uav。
robot: 'uav'

# ROS 命名空间。单车调试保持为空即可。
namespace: ''

# 图像输入源：
#   video      本地视频文件，调视频路径看 config/video_player_params.yaml
#   mindvision MindVision 相机
#   hik        海康相机
image_source: 'video'

# 串口来源：
#   true  使用虚拟下位机，调姿态/模式看 config/virtual_serial_params.yaml
#   false 使用真实串口，调串口号/协议看 config/<robot>/serial_driver_params.yaml
virtual_serial: true


# ============================================================
# 2. aim_v2 自瞄核心默认参数
# ============================================================

aim_v2:
  # true: 只有串口 mode 属于自瞄模式时才输出云台指令。
  respect_mode: true

  # true: 没收到 /serial/receive 前不解算，只发布空指令。
  # 离线调试时配合 virtual_serial=true 使用。
  require_serial: true

  # 离线和第一次上车检查必须 false。
  enable_fire: false

  # aimer: 简单直接，建议先用它跑通链路。
  # planner: SP25 Planner/TinyMPC 路径，链路稳定后再切。
  control_backend: 'aimer'

  # yolo: 使用 SP25 YOLO/OpenVINO 检测器。
  # traditional: 使用 SP25 传统灯条检测器。
  detector_type: 'yolo'

  # false 更容易排查；基础链路稳定后再尝试 true。
  async_inference: false

  # 空字符串表示根据串口 mode 自动推导敌方颜色。
  # 需要强制时填 'red' 或 'blue'。
  enemy_color: ''
  derive_enemy_color_from_mode: true
