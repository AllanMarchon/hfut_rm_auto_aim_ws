# Robot Pose Estimator Configuration
robot_pose_estimator:
  ros__parameters:
    # Debug mode - 启用后会发布可视化markers
    debug: true

    # Target frame - consistent with armor_detector
    target_frame: "odom"

    # Predict rate (Hz)
    predict_rate: 100.0

    # Topic configuration
    # 注意：订阅armor_detector的检测结果，避免与armor_tracker形成反馈回路
    # 数据流: armor_detector -> robot_pose_estimator -> virtual_armors -> armor_tracker
    topics:
      armors_sub: "/armor_detector/armors"  # 直接从detector获取检测结果
      robots_pub: "/robot_pose_estimator/robots"
      virtual_armors_pub: "/robot_pose_estimator/virtual_armors"
      target_pub: "/robot_pose_estimator/target"
      markers_pub: "/robot_pose_estimator/markers"

    # EKF parameters
    ekf:
      # Process noise
      sigma2_q_xyz: 0.05    # Position process noise
      sigma2_q_yaw: 1.0     # Yaw process noise
      sigma2_q_r: 0.05      # Radius process noise
      
      # Measurement noise
      r_xyz: 0.05           # Position measurement noise
      r_yaw: 0.02           # Yaw measurement noise

    # Tracking parameters
    tracking:
      max_match_distance: 0.5   # Maximum matching distance (m)
      max_match_yaw_diff: 1.0   # Maximum yaw difference (rad)
      tracking_threshold: 5     # Frames to enter tracking state
      lost_threshold: 100       # Frames to enter lost state
      robot_timeout: 2.0        # Robot timeout (s)

    # Robot geometry parameters
    robot:
      balance_radius: 0.15      # Balance infantry radius (m)
      standard_radius: 0.23     # Standard robot radius (m)
      hero_radius: 0.28         # Hero robot radius (m)
      outpost_radius: 0.26      # Outpost radius (m)

    # Virtual armor generation
    virtual_armor_generation: true
