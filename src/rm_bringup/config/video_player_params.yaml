# ============================================================
# 本地视频输入调参文件
# ============================================================
#
# bringup_v2 会优先读取 config/video_player_params.yaml。
#
# 什么时候看这个文件：
#   launch_params_decoupled.yaml 中：
#     image_source: video
#
# 最常调：
#   video_path        视频路径
#   fps               按视频实际帧率或压测需求修改
#   camera_info_url   视频对应的相机内参
#
# 路径说明：
#   相对路径按 ros2 launch 命令执行时的当前目录解析。
#   如果不确定当前目录，建议直接写绝对路径。

video_player:
  ros__parameters:
    # 视频文件路径。
    video_path: "decoded/output.mp4"
    # video_path: "./test_video/output.avi"
    # video_path: "tmp/camera.mp4"
    # video_path: "tmp/jlu_vision_26/assets/big_buff.avi"

    # true: 播完后循环；false: 播完停止。
    loop_playback: true

    # 发布帧率。离线验证先用 30 或视频真实帧率，压测再提高。
    fps: 120.0

    # frame_id 会生成为 "<camera_name>_optical_frame"。
    camera_name: "camera"

    # 图像倒装时再打开。
    flip_image: false

    # 不带 namespace 时实际发布 /image_raw。
    image_topic: "image_raw"

    # true 更接近相机 sensor QoS；如果订阅不到图像，可临时改 false 排查。
    use_sensor_data_qos: true

    # 视频源对应的相机内参。PnP/解算依赖这个文件。
    camera_info_url: "package://rm_bringup/config/camera_info.yaml"
