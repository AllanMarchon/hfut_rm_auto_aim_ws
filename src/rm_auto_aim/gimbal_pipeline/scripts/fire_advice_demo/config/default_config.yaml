fire_probability:
  future_window_ms: 50.0
  future_step_ms: 10.0
  system_delay_ms: 8.0
  fire_delay_ms: 15.0
  window_fusion: max
  softmax_beta: 20.0

ballistic:
  bullet_speed: 28.0
  gravity: 9.81
  muzzle_pos_b: [0.0, 0.0, 0.0]
  solve_with_gx: true

ballistic_uncertainty:
  model: linear_std
  sigma_x0: 0.010
  sigma_y0: 0.015
  sigma_z0: 0.015
  growth_x: 0.03
  growth_y: 0.06
  growth_z: 0.08
  q_x: 0.0009
  q_y: 0.0036
  q_z: 0.0064
  min_sigma: 0.005
  max_sigma: 0.200

tracker_uncertainty:
  use_tracker_covariance: true
  fallback_sigma_x: 0.020
  fallback_sigma_y: 0.020
  fallback_sigma_z: 0.030

normal_velocity_weight:
  enable: false
  v_ref: 28.0
  w_min: 0.5

fire_gate:
  mode: lowpass
  alpha: 0.85
  fire_on_th: 0.65
  fire_off_th: 0.35
  integrator_base_probability: 0.45
  integrator_rise: 8.0
  integrator_fall: 6.0

sigma_point_extension:
  enable: true
  method: unscented
  sigma_v0: 0.3
  sigma_delay: 0.005
  rho: 0.0
  alpha: 0.7
  beta: 2.0
  kappa: 0.0
  min_bullet_speed: 5.0

armor:
  width: 0.135
  height: 0.125

simulation:
  duration_s: 6.0
  fps: 120.0
  target_initial_odom: [4.8, -0.35, 0.15]
  target_velocity_odom: [-0.18, 0.23, 0.0]
  target_motion_amplitude_y: 0.18
  target_motion_frequency_hz: 0.7
  target_motion_amplitude_z: 0.04
  target_motion_frequency_z_hz: 1.1
  armor_yaw_rate_rad_s: 0.65
  tracker_noise_sigma: [0.010, 0.012, 0.010]
  tracker_covariance_sigma: [0.020, 0.025, 0.020]
  aim_yaw_noise_rad: 0.0012
  aim_pitch_noise_rad: 0.0010
  random_seed: 7

visualization:
  output_dir: outputs
  figure_name: fire_probability_demo.png
  show: false
