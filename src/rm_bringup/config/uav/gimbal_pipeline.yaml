    controller.mpc.N: 5
    controller.mpc.dt: 0.010
    controller.mpc.control_delay_s: 0.0
    controller.mpc.max_accel: 18.0
    controller.mpc.q_yaw: 1000.0 #追踪权重
    controller.mpc.q_pitch: 1000.0
    controller.mpc.q_yaw_vel: 90.0 #角速度跟踪权重
    controller.mpc.q_pitch_vel: 2.0
    controller.mpc.r_yaw: 0.008 #控制惩罚越大越柔和
    controller.mpc.r_pitch: 0.015
    controller.mpc.s_yaw: 0.050  #末端轨迹
    controller.mpc.s_pitch: 0.010

