# Max Entropy Tracker 参数配置
#
# 坐标系说明：
#   - UKF 计算统一在**相机坐标系**下进行
#   - 相机坐标系：X轴右，Y轴下，Z轴前（光轴方向）
#   - Yaw角定义：装甲板朝向为旋转中心指向装甲板的径向方向（外法向）
#   - 详见 docs/坐标系定义.md

/**:
  ros__parameters:
    # ========== 坐标系配置 ==========
    # 注意：UKF 内部计算在相机坐标系下，target_frame 仅用于 TF 变换输出
    target_frame: "odom"                    # 目标坐标系（世界坐标系，用于输出）
    source_frame: "camera_optical_frame"    # 源坐标系（相机坐标系，UKF计算坐标系）
    
    # ========== 基本配置 ==========
    # 预测频率（Hz）- 定时器频率
    predict_rate: 20.0
    
    # 跟踪器默认参数
    default_r1: 0.15                        # 默认半径1（米）
    default_r2: 0.20                        # 默认半径2（米）
    default_dza: 0.0                        # 默认装甲板高度差（米）
    
    # 跟踪器超时时间（秒）
    tracker_timeout: 5.0
    
    # CSV 日志配置
    enable_csv_logging: true               # 是否启用 CSV 日志
    csv_log_path: "/tmp/max_entropy_tracker_log.csv"  # CSV 日志路径

    # 调试模式
    debug_mode: false

    # 震荡检测
    enable_oscillation_detection: false

    # ========== UKF 参数 ==========
    ukf.alpha: 0.001
    ukf.beta: 2.0
    ukf.kappa: 0.0
    ukf.obs_noise_pos: 0.008
    ukf.obs_noise_yaw: 0.05
    ukf.dual_obs_noise_pos: 0.001
    ukf.dual_obs_noise_yaw: 0.03
    ukf.dual_obs_geometry_noise_scale: 0.002
    ukf.single_obs_update_weight_pos: 5.0
    ukf.enable_innovation_gating: false
    ukf.innovation_gate_chi2_threshold: 9.49

    # ========== Motion model 参数（平移模型）==========
    # 可选值: "CV"（恒速）, "CA"（恒加速）, "Singer"（Singer模型）
    motion.translation_model: "Singer"
    motion.cv_process_noise_vel: 0.001        # CV模型速度过程噪声
    motion.ca_process_noise_acc: 0.01       # CA模型加速度过程噪声
    motion.singer_alpha: 0.5                # Singer模型机动时间常数倒数
    motion.singer_sigma: 0.10                # Singer模型加速度标准差
    motion.process_noise_r: 0.00002             # 半径过程噪声
    motion.process_noise_dz: 0.00005           # 高度差过程噪声

    # ========== Spin model 参数（旋转模型）==========
    # 旋转模型固定使用 CA（恒角加速度）
    spin.spin_process_noise_yaw_rate: 1.0       # yaw角速度过程噪声
    spin.spin_process_noise_yaw_acc: 10.0        # yaw角加速度过程噪声
    spin.spin_process_noise_delta_rate: 1.0     # delta角速度过程噪声
    spin.spin_process_noise_delta_acc: 30.0      # delta角加速度过程噪声

    # ========== Entropy 参数 ==========
    entropy.temperature: 2.0
    entropy.use_adaptive: true
    entropy.k_prior_weight: 0.7

    # ========== Tracker 参数 ==========
    tracker.tracking_thres: 2
    tracker.lost_thres: 8
    tracker.temp_lost_thres: 3
    tracker.max_match_distance: 2.0
    tracker.max_match_yaw_diff: 1.0
    tracker.n_panels: 4
    tracker.panel_angle_step: 1.5707963267948966

    # ========== Constraint 参数 ==========
    constraints.min_radius: 0.12
    constraints.max_radius: 0.3
    constraints.min_dz: -1.0
    constraints.max_dz: 1.0

    # ========== 输出平滑器 (Output Smoother) ==========
    # 非侵入式后处理层：位置/yaw 用 1€ Filter 消抖，结构参数用 Robbins-Monro 收敛
    smoother.enable: true

    # 子组件开关
    smoother.enable_position_smooth: true
    smoother.enable_yaw_smooth: true
    smoother.enable_velocity_smooth: false
    smoother.enable_structural_convergence: false

    # ---- 位置平滑 (OneEuro 3D) ----
    # min_cutoff 越小越平滑但延迟越大；beta 越大对快速运动跟随越好
    smoother.pos_min_cutoff: 1.5        # Hz
    smoother.pos_beta: 0.01             # 速度响应系数
    smoother.pos_d_cutoff: 1.0          # 导数滤波截止

    # ---- Yaw平滑 (OneEuro Angle) ----
    smoother.yaw_min_cutoff: 1.5
    smoother.yaw_beta: 0.5
    smoother.yaw_d_cutoff: 1.0

    # ---- 速度平滑 (OneEuro 3D) ----
    smoother.vel_min_cutoff: 2.0
    smoother.vel_beta: 0.1
    smoother.vel_d_cutoff: 1.0

    # ---- 结构参数 Robbins-Monro 随机逼近 ----
    # 步长: a_n = initial_step / (n + n0)^gamma
    # gamma ∈ (0.5, 1], 0.75 为折中值
    smoother.rm_initial_step: 0.5       # c — 初始步长
    smoother.rm_gamma: 0.75             # γ — 衰减指数
    smoother.rm_n0: 5                   # 偏移量（避免初始步长过大）
    smoother.rm_dual_obs_boost: 3.0     # 双观测时步长放大倍数
    smoother.rm_min_radius: 0.12        # 半径下限
    smoother.rm_max_radius: 0.5         # 半径上限
    smoother.rm_min_dz: -1.0            # 高度差下限
    smoother.rm_max_dz: 1.0             # 高度差上限
    smoother.rm_convergence_eps: 0.0001 # 收敛判定阈值
    smoother.default_freq: 30.0         # 默认采样频率(Hz)
