# ============================================================
# 虚拟下位机调参文件
# ============================================================
#
# bringup_v2 会优先读取 config/virtual_serial_params.yaml。
#
# 什么时候看这个文件：
#   launch_params_decoupled.yaml 中：
#     virtual_serial: true
#
# 这个节点模拟下位机反馈，发布：
#   /serial/receive
#   odom -> gimbal_link TF
#
# 最常调：
#   yaw / pitch / roll  模拟云台当前姿态，单位为度
#   vision_mode         模拟电控给视觉的模式/颜色信息
#
# aim_v2 当前约定：
#   vision_mode: 0  -> 敌方红色
#   vision_mode: 1  -> 敌方蓝色

/**:
  ros__parameters:
    roll: 0.0
    pitch: 0.0
    yaw: 180.0
    vision_mode: 1
