armor_detector:
  ros__parameters:
    debug: true
    target_frame: "odom"
    debug_pose_compare: true
    publish_in_target_frame: false

    backend:
      type: "openvino"
      device: "CPU"
      precision: "fp16"
      model_path: "package://armor_detector_nn/model/RobotDetectionModel/0526.onnx"
      engine_path: "package://armor_detector_nn/model/RobotDetectionModel/0526.onnx"
      openvino_model_xml: ""
      openvino_model_bin: ""
      calibration_cache: ""
      input_name: "images"
      output_names: ["output"]
      warmup_iterations: 10
      num_threads: 2
      allow_fallback: true
      fallback_type: "onnxruntime"
      openvino_use_native_preprocess: false
      openvino_cache_dir: ""
      openvino_hybrid_affinity: false
      openvino_num_requests: 1
      openvino_device_config: ""

    preprocess:
      input_width: 640
      input_height: 640
      input_layout: "nchw"
      input_color: "rgb"
      resize_mode: "letterbox"
      normalize: true
      mean: [0.0, 0.0, 0.0]
      std: [255.0, 255.0, 255.0]
      pad_value: 114.0

    postprocess:
      strategy: "robotpilots_landmark"
      output_layout: "candidates_first"
      num_classes: 14
      num_keypoints: 4
      keypoint_dims: 2
      bbox_offset: 0
      class_offset: 4
      keypoint_offset: 18
      box_format: "xyxy_from_kpts"
      conf_threshold: 0.65
      nms_threshold: 0.45
      max_detections: 32
      class_agnostic_nms: false
      keypoint_remap: [0, 1, 2, 3]
      head_already_applied: true
      keypoint_auto_reorder: false

    label_map:
      path: "package://armor_detector_nn/config/label_map.yaml"

    number_classifier:
      enabled: false
      model_path: ""
      label_path: ""
      threshold: 0.8
      ignore_classes: ["negative"]

    pose:
      use_ba: true
      pnp_method: "ippe"
      small_armor_width: 0.133
      small_armor_height: 0.050
      large_armor_width: 0.225
      large_armor_height: 0.050
      pose.force_pnp_rotate_180: true

      refiner:
        mode: "sliding_window"

      single_yaw:
        max_iterations: 8
        huber_delta: 3.0
        pitch_deg_default: 15.0
        roll_deg_default: 0.0
        outpost_pitch_sign: true

      sliding:
        window_size: 8
        min_frames: 4
        max_time_span_ms: 300.0
        max_solver_time_ms: 2.0
        max_opt_iters: 12
        sigma_prior_xy: 0.08
        sigma_prior_z: 0.15
        sigma_prior_yaw: 0.35
        sigma_smooth_xy: 0.05
        sigma_smooth_z: 0.10
        sigma_smooth_yaw: 0.10
        sigma_kp_min: 1.0
        sigma_kp_scale: 5.0
        huber_delta: 3.0

      gate:
        max_reproj_error: 3.0
        max_pose_delta_m: 0.20
        max_yaw_delta_deg: 20.0
        require_finite: true

    tracker:
      strategy: "internal_iou"
      iou_threshold: 0.30
      max_missed: 15
      min_hits: 2
      max_center_dist_px: 120

    corner_refine:
      enabled: true
      apply_on_confirmed_only: true
      max_targets_per_frame: 1
      time_budget_ms: 2.0
      roi_expand_ratio: 1.2
      min_bright_points: 30
      pca_stability_threshold: 0.7
      max_aspect_ratio: 5.0
      min_aspect_ratio: 1.5

    async:
      enabled: false
      max_wait_ms: 2.0
      drop_if_busy: true
      max_observation_age_ms: 100.0

    runtime:
      color_filter_source: "model"
      publish_empty: true
      drop_frame_when_busy: true
      copy_policy: "copy_on_write_debug"
      scheduling_mode: "sync"
      frame_queue_size: 2
      batch_min_size: 1
      batch_max_size: 1
      batch_timeout_ms: 2.0
      max_observation_age_ms: 50.0
      publish_out_of_order: false
      profile: true
