    # controller.mpc.weighting.sigma_min: 0.05 # 最小角度不确定性 (rad)，防止过度自信导致权重过大
    # controller.mpc.weighting.sigma_max: 0.5 # 最大角度不确定性 (rad)，防止过度不确定导致权重过小
    # controller.mpc.weighting.sigma_sys: 0.02 # 系统误差引起的角度不确定性 (rad)，与目标距离成正比
    # controller.mpc.weighting.target_size: 0.135 # 目标尺寸 (m)，用于将线速度转换为角度不确定性
    # controller.mpc.weighting.delay_s: 0.0 # 额外预测延迟 (秒)，叠加在 controller.mpc.control_delay_s 之上，用于模拟更长的系统延迟对权重的影响
    # controller.mpc.weighting.max_w: 6.0 # 权重上限，防止过大权重导致优化数值问题
    # controller.mpc.weighting.smooth_alpha: 0.7 # 权重平滑系数，越大越平滑，范围 [0,1]
    # controller.mpc.weighting.min_distance: 0.1 # 最小距离 (m)，用于权重计算中的距离归一化，防止过近时权重过大
    # controller.mpc.weighting.sigma_beta: 0.3 # 角速度引起的不确定性增量权重，越大越明显地降低快速转动时的权重
    # controller.mpc.weighting.gamma: 0.5 # 快速转动时权重衰减调整因子，越大衰减越激烈

    # MPC 轨迹生成前速度 clamp
    # 在轨迹生成之前对目标速度进行限幅，防止极端高速状态导致参考轨迹发散:
    #   center_velocity: 保持方向不变，对速度标量 clamp 到 max_linear_speed
    #   yaw_velocity:    直接 clamp 到 [-max_v_yaw, +max_v_yaw]
    # enable: false 时不做任何处理，行为与原版完全一致
    controller.mpc.vel_clamp.enable: true
    controller.mpc.vel_clamp.max_linear_speed: 1.50   # 线速度标量上限 (m/s)
    controller.mpc.vel_clamp.max_v_yaw: 10.0         # yaw 角速度上限 (rad/s)

    # MPC 延时补偿: 启用后参考轨迹生成考虑 processing_delay + controller_delay + prediction_delay
    # 并对每步迭代补偿子弹飞行时间、选板时考虑延迟后的云台姿态
    # enable_delay_compensation: false 时行为与原版完全一致
    controller.mpc.enable_delay_compensation: true
    controller.mpc.prediction_delay_s: 0.0      # 额外预测延迟 (秒), 叠加在 processing_delay 之上
    controller.mpc.flight_time_iters: 2          # 飞行时间迭代补偿次数
    controller.mpc.max_processing_delay_s: 0.3   # 最大处理延迟 clamp 上限 (秒)
    # yaw 速度前馈等效前瞻时间 (秒): yaw_ff ≈ target_yaw_velocity * k_s
    # k_s=0.0 时禁用，推荐从 0.02~0.08 逐步调参
    # controller.mpc.yaw_feedforward_k_s: 0.000

