# Target Selector Configuration
target_selector:
  ros__parameters:
    # Selection strategy
    # Options: "min_yaw_deviation" (more strategies can be added)
    strategy: "min_yaw_deviation"

    # Reference yaw direction for selection (rad)
    # 0.0 means gimbal forward direction
    reference_yaw: 0.0

    # Selection constraints
    max_yaw_deviation: 3.14159  # Maximum allowed yaw deviation (rad), default to PI
    max_distance: 10.0          # Maximum allowed distance (m) 
    min_confidence: 0.15         # Minimum robot confidence required [0, 1]

    # Hysteresis for target switching
    # Prevents rapid switching between targets
    # New target must be this fraction better than current to switch
    hysteresis_threshold: 0.1

    # TF coordinate frames
    gimbal_frame: "gimbal_link"
    odom_frame: "odom"

    # Topic configuration
    topics:
      robots_sub: "/robot_pose_estimator/robots"
      selected_target_pub: "/target_selector/selected_target"
      markers_pub: "/target_selector/markers"
      set_target_service: "/trajectory_planner/set_target_robot"
      trajectory_action: "/trajectory_planner/trajectory_plan"

    # Debug mode - enables visualization markers
    debug: false
