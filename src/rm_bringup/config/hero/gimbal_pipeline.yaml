gimbal_pipeline:
  ros__parameters:
    # ═══════════════════════════════════════════════════════════════
    # Tracker parameters (from max_entropy_tracker)
    # ═══════════════════════════════════════════════════════════════
    target_frame: "odom"
    source_frame: "camera_optical_frame"
    predict_rate: 20.0
    default_r1: 0.15
    default_r2: 0.20
    default_dza: 0.0
    tracker_timeout: 5.50
    debug_mode: true
    enable_oscillation_detection: false
    visualization_frame: "odom"
    robot_description.strict_unknown_reject: true

    # UKF tuning
    ukf.alpha: 0.001
    ukf.beta: 2.0
    ukf.kappa: 0.0
    ukf.obs_noise_pos: 0.08
    ukf.obs_noise_yaw: 0.05
    ukf.dual_obs_noise_pos: 0.01
    ukf.dual_obs_noise_yaw: 0.03
    ukf.dual_obs_geometry_noise_scale: 0.02
    ukf.single_obs_update_weight_pos: 5.0
    ukf.enable_innovation_gating: false
    ukf.innovation_gate_chi2_threshold: 9.49

    # Motion model
    motion.translation_model: "Singer"  # "CV" | "Singer"
    motion.cv_process_noise_vel: 1.20
    motion.ca_process_noise_acc: 0.1
    motion.singer_alpha: 1.5
    motion.singer_sigma: 0.30
    motion.process_noise_r: 0.002
    motion.process_noise_dz: 0.00005

    # Spin model
    spin.spin_process_noise_yaw_rate: 3.5
    spin.spin_process_noise_yaw_acc: 18.0
    spin.spin_process_noise_delta_rate: 3.50
    spin.spin_process_noise_delta_acc: 45.0

  #$
    # Entropy
    entropy.temperature: 2.0
    entropy.use_adaptive: true
    entropy.k_prior_weight: 0.7

    # Tracker logic
    tracker.tracking_thres: 2
    tracker.lost_thres: 4
    tracker.temp_lost_thres: 3
    tracker.max_match_distance: 2.0
    tracker.max_match_yaw_diff: 1.0
    tracker.n_panels: 4
    tracker.panel_angle_step: 1.5707963267948966
    # 标准4板周期证据（-dz,+dz,-dz,+dz，符号随旋向翻转）
    tracker.periodic_binding_enable: false
    tracker.periodic_binding_weight: 0.35
    tracker.periodic_binding_spin_rate_gate: 0.8

    # Constraints
    constraints.min_radius: 0.12
    constraints.max_radius: 0.3
    constraints.min_dz: -1.0
    constraints.max_dz: 1.0

    # Outpost tracker (known 3-armor geometry + max-entropy mode switch)
    outpost.translation_model: "CA"   # "CV" | "CA" | "Singer"
    outpost.rotation_model: "CA"      # "CV" | "CA"
    # Outpost state machine thresholds (independent from tracker.* used by adaptive)
    outpost.tracking_thres: 2
    outpost.lost_thres: 50
    outpost.temp_lost_thres: 20
    outpost.max_match_distance: 2.0
    outpost.max_match_yaw_diff: 1.0
    outpost.singer_alpha: 0.01          # <=0: fallback to motion.singer_alpha
    outpost.singer_sigma: 0.01          # <=0: fallback to motion.singer_sigma
    outpost.spin_process_noise_theta_rate: 1.0  # <=0: fallback to spin.spin_process_noise_delta_rate
    outpost.spin_process_noise_theta_acc: 1.0   # <=0: fallback to spin.spin_process_noise_delta_acc
    outpost.radius: 0.275
    # 语义约定:
    #   id0=最高, id1=中间, id2=最低
    # 俯视顺时针角序:
    #   0deg(id0) -> 120deg(id2) -> 240deg(id1)
    outpost.z_offset_0: 0.102
    outpost.z_offset_1: 0.00
    outpost.z_offset_2: -0.102
    outpost.panel_angle_step: 2.0943951023931953
    outpost.softmax_temperature: 1.5
    outpost.weight_yaw: 1.0
    outpost.weight_z_state: 6.0
    outpost.weight_z_history: 2.0
    outpost.weight_xy_residual: 2.5
    outpost.weight_switch_penalty: 0.05
    outpost.entropy_enter: 0.75
    outpost.entropy_exit: 0.60
    outpost.max_prob_enter: 0.60
    outpost.max_prob_exit: 0.75
    outpost.stable_frames: 4
    outpost.z_history_window: 15
    outpost.single_mode_confidence_scale: 0.70
    # binding parameters 
    outpost.binding_enable_multi_obs: true
    outpost.binding_transition_confirm_frames: 3 # 过渡状态确认帧数
    outpost.binding_same_panel_yaw_gate: 0.35    # 同板块候选 yaw 差门限 (rad)，过大可能误绑定不同板，过小可能错过同板候选
    outpost.binding_same_panel_z_gate: 0.08      # 同板块候选 z 差门限 (m)，过大可能误绑定不同板，过小可能错过同板候选
    outpost.binding_same_panel_xy_gate: 0.18     # 同板块候选 xy 差门限 (m)，过大可能误绑定不同板，过小可能错过同板候选
    outpost.binding_min_candidate_prob: 0.40     # 绑定候选最小概率门限，过高可能错过正确绑定，过低可能引入错误绑定
    outpost.binding_min_candidate_margin: 0.12   # 绑定候选相对次优的最小概率边际，过高可能错过正确绑定，过低可能引入错误绑定
    outpost.binding_switch_strong_score: 0.60    # 直接切换到新候选的强绑定分数门限，过高可能错过正确绑定，过低可能引入错误绑定
    outpost.binding_period_window: 12            # 周期绑定窗口长度（帧数），过长可能引入错误绑定，过短可能错过周期绑定机会
    outpost.binding_period_weight: 0.60          # 周期绑定候选分数权重，过高可能引入错误绑定，过低可能错过周期绑定机会
    outpost.binding_period_min_spin_rate: 0.8    # 周期绑定最小旋转速率门限 (rad/s)，过高可能错过周期绑定机会，过低可能引入错误绑定
    outpost.binding_period_update_min_confidence: 0.55 # 周期绑定更新最小置信度门限，过高可能错过正确绑定更新，过低可能引入错误绑定更新
    outpost.binding_period_update_min_jump: 0.015      # 周期绑定更新最小跳变门限 (m)，过高可能错过正确绑定更新，过低可能引入错误绑定更新
    outpost.binding_dz_ema_alpha: 0.20           # z 跳变 EMA 平滑系数，过高可能引入过度平滑导致响应迟钝，过低可能错过正确绑定更新
    outpost.binding_confidence_floor: 0.15       # 绑定置信度下限，过高可能错过正确绑定，过低可能引入错误绑定
    outpost.alpha_pos: 0.65                      # 位置残差权重衰减，过高可能导致 tracker 对位置残差不敏感，过低可能导致 tracker 过度依赖位置残差
    outpost.beta_vel: 0.30                       # 速度残差权重衰减，过高可能导致 tracker 对速度残差不敏感，过低可能导致 tracker 过度依赖速度残差
    outpost.alpha_yaw: 0.60                      # 朝向残差权重衰减，过高可能导致 tracker 对朝向残差不敏感，过低可能导致 tracker 过度依赖朝向残差
    outpost.beta_yaw_rate: 0.25                  # 角速度残差权重衰减，过高可能导致 tracker 对角速度残差不敏感，过低可能导致 tracker 过度依赖角速度残差
    outpost.assume_static_center: true           # 假设中心点静止，启用后 tracker 可能更稳定但对快速移动目标响应不足
    outpost.linear_velocity_damping: 0.90        # 线速度权重衰减，过高可能导致 tracker 对线速度不敏感，过低可能导致 tracker 过度依赖线速度
    outpost.yaw_rate_damping: 0.98               # 角速度权重衰减，过高可能导致 tracker 对角速度不敏感，过低可能导致 tracker 过度依赖角速度
    outpost.max_center_speed: 1.00               # 最大中心点速度 (m/s)，过高可能导致 tracker 对快速移动目标响应不足，过低可能导致 tracker 过度依赖慢速假设
    outpost.max_yaw_rate: 12.0                   # 最大 yaw 速率 (rad/s)，过高可能导致 tracker 对快速旋转目标响应不足，过低可能导致 tracker 过度依赖慢速假设

    # Panel mismatch detection
    panel_mismatch.enable: true
    panel_mismatch.window_size: 8
    panel_mismatch.threshold_t1: 0.0000009
    panel_mismatch.confirm_count: 3
    panel_mismatch.reinit_count: 5
  #$

    # Output smoother (1-Euro filter + Robbins-Monro)
    # 1-Euro filter 参数说明：
    # - *_min_cutoff: 1-Euro 最小截止频率
    #   -> 目标静止时的基础平滑强度，越小滤波越强，越稳定，延迟越大
    # - *_beta: 1-Euro 速度自适应系数，即运动越快，截止频率增加多少
    # - *_d_cutoff: 1-Euro 导数截止频率
    #   -> 如果这个值太小：速度变化迟钝、响应慢；如果太大：速度非常敏感，容易抖
    # Robbins-Monro 参数说明：
    # - rm_initial_step: 初始步长，越大收敛越快但可能不稳定，越小收敛越慢但更稳定
    # - rm_gamma: 学习率衰减因子，范围 (0,1)，越大后期调整越慢，越小后期调整越快
    # - rm_n0: 步长衰减起始点，越大初期调整越快，越小初期调整越慢
    # - rm_dual_obs_boost: 遇到双目标时的步长增益，越大越快切换到新目标，但可能不稳定
    # - rm_min_radius / rm_max_radius: 影响步长调整的目标距离范围，越大范围内调整越明显，但可能过度调整近远目标
    # - rm_min_dz / rm_max_dz: 影响步长调整的目标高度差范围，越大范围内调整越明显，但可能过度调整不同高度的目标
    smoother.enable: true
    smoother.enable_position_smooth: true
    smoother.enable_yaw_smooth: false
    smoother.enable_velocity_smooth: true
    smoother.enable_structural_convergence: true
    smoother.pos_min_cutoff: 1.0
    smoother.pos_beta: 0.01
    smoother.pos_d_cutoff: 1.0
    smoother.yaw_min_cutoff: 1.0
    smoother.yaw_beta: 0.005
    smoother.yaw_d_cutoff: 1.0
    smoother.vel_min_cutoff: 0.10
    smoother.vel_beta: 0.01
    smoother.vel_d_cutoff: 1.0
    smoother.rm_initial_step: 0.5
    smoother.rm_gamma: 0.75
    smoother.rm_n0: 5
    smoother.rm_dual_obs_boost: 3.0
    smoother.rm_min_radius: 0.12
    smoother.rm_max_radius: 0.5
    smoother.rm_min_dz: -1.0
    smoother.rm_max_dz: 1.0
    smoother.rm_convergence_eps: 0.0001
    smoother.default_freq: 30.0

    # ---- Outlier filter (pre-smoother, independent of smoother.enable) ----
    # When an outlier is detected the last valid SmoothedOutput is held
    # (held-frame strategy) so One-Euro filter state is not corrupted.
    smoother.enable_outlier_filter: false
    smoother.outlier_method: "mad"        # "mad" | "iqr" | "mahalanobis"
    smoother.outlier_window_size: 10      # rolling window length
    smoother.outlier_min_samples: 5       # start filtering after N samples
    smoother.outlier_mad_k: 3.5           # MAD: |val - median| > k * MAD
    smoother.outlier_iqr_k: 1.5           # IQR: |val - median| > k * IQR
    smoother.outlier_mahal_threshold: 9.21  # Mahalanobis: d2 > threshold

    # ═══════════════════════════════════════════════════════════════
    # Target selector parameters
    # ═══════════════════════════════════════════════════════════════
    selector.strategy: "priority_list"
    # selector.strategy options:
    #   "min_yaw_deviation"            - select by smallest yaw deviation
    #   "priority_list"                - select by selector.priority_robot_ids order
    #   "sticky_min_yaw_deviation"     - min_yaw + preferred-id locking
    selector.reference_yaw: 0.0
    selector.max_yaw_deviation: 3.14159
    selector.max_distance: 10.0
    selector.min_confidence: 0.15
    selector.hysteresis_threshold: 0.1
    # selector.priority_robot_ids: ["1", "2", "3", "4", "5", "sentry", "outpost", "base"]
    selector.priority_robot_ids: ["1", "2", "3", "4", "5", "sentry", "outpost", "base"]
    selector.sticky_lock_frames: 3
    selector.sticky_lost_frames: 3

    # ═══════════════════════════════════════════════════════════════
    # Gimbal controller parameters
    # ═══════════════════════════════════════════════════════════════
    controller.bullet_speed: 11.50
    controller.control_rate: 250.0
    controller.strategy: "mpc"    # "current" | "predicted" | "mpc" | "state_machine"
    controller.ballistic_mode: "local"  # "service" | "local"

    # Unified delay parameters (preferred)
    # 说明：优先使用 controller.delay.*，其余 solver/mpc/fire 下的同语义参数仅保留兼容。
    controller.delay.prediction_extra_s: 0.00
    controller.delay.control_latency_s: 0.00
    controller.delay.trigger_to_muzzle_s: 0.100
    controller.delay.max_processing_delay_s: 0.5
    controller.delay.flight_time_iters: 2

    controller.solver.shooting_range_width: 0.135
    controller.solver.shooting_range_height: 0.135
    controller.solver.side_angle: 15.0
    controller.solver.min_switching_v_yaw: 0.0
    controller.solver.prediction_delay: 0.100        # 预测延迟 (秒)，等效于提前预测时间，补偿系统延迟(仅对 predicted 策略生效)
    controller.solver.max_prediction_time: 0.500     # 预测最大时间 (秒)，防止过远预测导致误差过大（仅对 predicted 策略生效）
    controller.solver.max_tracking_v_yaw: 12.0
    controller.solver.transfer_thresh: 5
    controller.solver.gravity: 9.8
    controller.solver.resistance: 0.001
    controller.solver.iteration_times: 20
    controller.solver.pitch_offset: 0.0
    controller.solver.yaw_offset: 0.0

    # controller_delay: 在 TRACKING_ARMOR 状态下，额外叠加此延迟作为云台控制目标 (秒)
    # 设为 0 禁用（默认）。等价于 armor_solver 原版 controller_delay 机制。
    # 若启用自适应 delay（adaptive_delay.enable=true），本值作为 delay 初始值。
    controller.solver.controller_delay: 0.00 # 秒，等效于提前预测时间，补偿系统延迟（仅对 predicted 策略生效）
    # 触发到枪口时延（秒），可用于补偿电控触发链路（与 fire.* 同名参数含义一致）
    # controller.solver.trigger_to_muzzle_s: 0.0

    # ── 自适应 controller_delay（AIMD 策略）────────────────────────
    # 启用后根据目标线速度/角速度及连续未开火帧数动态调整 controller_delay：
    #   开火成功  →  delay -= add_step                       (线性减小, AD)
    #   连续未开火超 fire_wait_threshold 帧
    #           →  delay *= 1 + (mul_factor-1) * speed_factor (加权乘性增大, MI)
    #     speed_factor = max(min(|v_xyz|/max_linear_speed, 1),
    #                        min(|v_yaw|/max_angular_speed, 1))
    # enable=false 时退化为静态 controller_delay，行为与原版完全一致。
    controller.solver.adaptive_delay.enable: false
    controller.solver.adaptive_delay.fire_wait_threshold: 10   # 连续未开火多少帧后开始增大
    controller.solver.adaptive_delay.mul_factor: 1.2           # 乘性增幅因子(>1)
    controller.solver.adaptive_delay.add_step: 0.005           # 开火成功时每帧减小量 (秒)
    controller.solver.adaptive_delay.max_delay: 0.10           # delay 上限 (秒)
    controller.solver.adaptive_delay.min_delay: 0.0            # delay 下限 (秒)
    controller.solver.adaptive_delay.max_linear_speed: 3.0     # 线速度归一化参考 (m/s)
    controller.solver.adaptive_delay.max_angular_speed: 10.0   # 角速度归一化参考 (rad/s)

    # FireAdvice 触发策略参数
    controller.fire.trigger_to_muzzle_s: 0.0           # 触发到枪口的时延补偿 (s)
    controller.fire.decision_policy: "axis_threshold" # 开火决策策略
    controller.fire.flight_time_iters: 2               # 飞行时间迭代次数
    controller.fire.use_gimbal_kinematics: true      # 使用云台运动学补偿
    # 目标可打性策略：
    #   facing_only: 仅允许朝向可打候选触发 fire=true（推荐）
    #   legacy_all : 兼容旧行为，所有候选都可触发 fire=true
    controller.fire.target_visibility_policy: "facing_only"
    # FireAdvice 装甲板朝向过滤开角（度）
    # 定义：装甲板法向与“装甲板 -> 枪口(坐标原点)”夹角的允许全开角。
    #   180.0: 不过滤（兼容旧行为）
    #   120.0: 常用，过滤明显背向板
    #   90.0 : 更严格，只保留近正向板
    controller.fire.facing_filter_opening_angle_deg: 85.0

    # ── 选板算法参数 ──────────────────────────────────
    # selection_method: 选板算法
    #   min_movement_with_facing  — 最小运动量 + 正面朝向 Hysteresis 过滤（默认）
    #   min_movement_with_radial  — 过滤后按机器人中心径向夹角最小选板
    #   min_movement              — 纯最小运动量，无朝向过滤
    #   decision_angle            — 传统决策角算法（与 armor_solver 原版一致）
    #   virtual_pose              — 虚拟姿态选板，自动生成一个理想控制板（不要求真实存在）来选板
    #   virtual_fixed_id           — 固定 ID 虚拟姿态选板，直接生成一个固定 ID 的理想控制板来选板
    #   facing_or_virtual_pose     — FireAdvice 同语义朝向过滤，真实可打板优先；无可打板时退回 virtual_pose
    #   facing_or_virtual_fixed_id — 仅固定 ID 真实可打时输出真实板；否则退回该 ID 的 virtual_fixed_id
    controller.solver.selection_method: "min_movement_with_facing"
    # controller.solver.virtual_pose.fixed_id: 2 # "virtual_fixed_id" 时设置固定的id

    # 虚拟姿态选板（"virtual_pose"）
    # 逻辑：先按估计 yaw 找到“未转到位”的最近真实板，再做最小旋转生成虚拟控制板。
    # 约束：虚拟板朝向沿“目标中心 -> 云台中心”连线。
    # controller.solver.selection_method: "virtual_pose"
    # controller.solver.selection_method: "virtual_fixed_id"
    controller.solver.virtual_pose.auto_switch.enable: true
    controller.solver.virtual_pose.auto_switch.enter_vyaw: 1.0
    controller.solver.virtual_pose.auto_switch.exit_vyaw: 16.0
    # auto_switch 模式可独立配置："virtual_pose" | "virtual_fixed_id"
    controller.solver.virtual_pose.auto_switch.selection_method: "virtual_fixed_id"
    # auto_switch 固定 ID（仅在 selection_method=virtual_fixed_id 时生效）
    controller.solver.virtual_pose.auto_switch.fixed_id: 0

    # 面向选板状态机参数
    controller.solver.facing_enter_angle: 5.0  # 55.0
    controller.solver.facing_exit_angle: 10.0  # 85.0
    # 径向选板动态阈值（仅对 min_movement_with_radial 生效）
    # 角度单位: 度；角速度单位: rad/s
    # |v_yaw| 越大，径向过滤阈值越小：
    #   th_dyn = max(th_base * (1 - shrink_ratio * clamp(|v_yaw|/v_yaw_ref,0,1)), min_angle_deg)
    controller.solver.radial_dynamic.enable: false
    controller.solver.radial_dynamic.v_yaw_ref: 15.0
    controller.solver.radial_dynamic.shrink_ratio: 60.0
    controller.solver.radial_dynamic.min_angle_deg: 5.0
    # 角平分线偏移（度）：|v_yaw| 越大，中心线偏移越大，且受上限约束。
    # 约定: v_yaw > 0 向左(逆时针, +yaw)偏移；v_yaw < 0 向右偏移。
    # bias_deg = sign(v_yaw) * min(bias_gain_deg * clamp(|v_yaw|/v_yaw_ref,0,1), max_bias_deg)
    controller.solver.radial_dynamic.bias_gain_deg: 60.0
    controller.solver.radial_dynamic.max_bias_deg: 50.0

    # 状态机策略参数（controller.strategy: "state_machine" 时生效）
    # controller.state_machine.facing_enter_angle: 40.0
    # controller.state_machine.facing_exit_angle: 55.0
    # controller.state_machine.spin_v_yaw_thresh: 4.0
    # controller.state_machine.calm_v_yaw_thresh: 2.0
    # controller.state_machine.spin_enter_count: 5
    # controller.state_machine.spin_exit_count: 5
    # controller.state_machine.side_angle: 15.0
    # controller.state_machine.prediction_delay: 0.0
    # controller.state_machine.max_prediction_time: 0.5

    # 兼容旧键（Deprecated aliases，建议仅迁移时使用）
    # solver.prediction_delay: 0.0
    # solver.max_prediction_time: 0.5
    # solver.controller_delay: 0.0
    # solver.trigger_to_muzzle_s: 0.0
    # state_machine.prediction_delay: 0.0
    # state_machine.max_prediction_time: 0.5

    
    # ── GimbalCmd 输出端保护滤波器 ──────────────────────────────────
    # 在 gimbal_cmd 发布前对 yaw_diff / pitch_diff 执行多级可配置保护：
    #   0. Clamping        — 绝对限幅，防止极端控制量
    #   1. Outlier Reject  — 帧间突变外点检测，hold 上帧或强制接受
    #   2. Rate Limiter    — 限制每帧变化量上限
    #   3. Moving Average  — 滑动窗口均值，抑制高频震荡
    #   4. EMA             — 指数移动平均平滑（默认关闭，会引入延迟）
    #   5. 1-Euro Filter   — 速度自适应低通（默认关闭，运动快时自动减弱平滑）
    # 各级独立开关；目标切换或从 idle 恢复时自动重置滤波器历史。

    # # 0. Clamping
    controller.output_filter.enable_clamping: false
    controller.output_filter.max_yaw_diff: 15.0      # 度，yaw_diff 绝对上限
    controller.output_filter.max_pitch_diff: 10.0    # 度，pitch_diff 绝对上限

    # # 1. 外点检测
    controller.output_filter.enable_outlier_rejection: false
    controller.output_filter.outlier_threshold_yaw: 8.0    # 帧间跳变判定阈值 (度)
    controller.output_filter.outlier_threshold_pitch: 5.0  # 帧间跳变判定阈值 (度)
    controller.output_filter.max_outlier_count: 3          # 连续外点超此数后强制 accept

    # # 2. Rate Limiter
    controller.output_filter.enable_rate_limiter: false
    controller.output_filter.max_yaw_rate: 5.0     # 每帧最大变化量 (度/帧 @ 250Hz)
    controller.output_filter.max_pitch_rate: 3.0   # 每帧最大变化量 (度/帧 @ 250Hz)

    # # 3. 滑动窗口均值（默认关闭；窗口越大越平滑但延迟更大）
    controller.output_filter.enable_moving_average: false
    controller.output_filter.moving_average_window_size: 10  # 采样帧数，>=1

    # # 4. EMA 平滑（默认关闭；开启会引入 1~2 帧延迟）
    controller.output_filter.enable_ema: false
    controller.output_filter.ema_alpha: 0.6         # (0,1]，越大越跟随，越小越平滑

    # # 5. 1-Euro 自适应低通滤波（默认关闭；运动快时自动减弱平滑，适合高速目标）
    controller.output_filter.enable_one_euro: false
    controller.output_filter.one_euro_freq: 250.0        # Hz，应与 control_rate 一致
    controller.output_filter.one_euro_min_cutoff: 0.05    # 最小截止频率 (Hz)
    controller.output_filter.one_euro_beta: 0.1        # 速度灵敏度（越大高速时截止频率越高）
    controller.output_filter.one_euro_d_cutoff: 0.01      # 导数截止频率 (Hz)

    # ── MPC 控制策略参数 ──────────────────────────────────
    # MPC 控制策略参数（controller.strategy: "mpc" 时生效）
    controller.mpc.N: 50
    controller.mpc.dt: 0.05    
    controller.mpc.control_delay_s: 0.00  
    controller.mpc.max_accel: 30.0    
    controller.mpc.q_yaw: 100.0    
    controller.mpc.q_pitch: 100.0    
    controller.mpc.q_yaw_vel: 1.0    
    controller.mpc.q_pitch_vel: 1.0
    controller.mpc.r_yaw: 0.001    
    controller.mpc.r_pitch: 0.001    
    controller.mpc.s_yaw: 0.001    
    controller.mpc.s_pitch: 0.001

    # MPC 数值稳健性: 统一 Q/R/S 量纲归一化
    # mode:
    #   - "rms": 在线滑窗 RMS 归一化（原实现）
    #   - "typical": 基于典型值的静态归一化（更稳健，适合避免 RMS 抖动放大）
    # enable=false 时保持原行为
    controller.mpc.normalization.enable: true
    controller.mpc.normalization.mode: "rms"
    controller.mpc.normalization.window_size: 80
    controller.mpc.normalization.min_samples: 10
    controller.mpc.normalization.rms_epsilon: 1e-6
    # typical 模式参数（单位: yaw/pitch=rad, yaw_vel/pitch_vel=rad/s, acc=rad/s^2）
    # scale 统一公式: w_norm = w / (typical^2 + eps)
    controller.mpc.normalization.typical_state.yaw: 1.0
    controller.mpc.normalization.typical_state.pitch: 1.0
    controller.mpc.normalization.typical_state.yaw_vel: 1.0
    controller.mpc.normalization.typical_state.pitch_vel: 1.0
    controller.mpc.normalization.typical_control.yaw_acc: 1.0
    controller.mpc.normalization.typical_control.pitch_acc: 1.0
    controller.mpc.normalization.typical_delta_control.yaw_acc: 1.0
    controller.mpc.normalization.typical_delta_control.pitch_acc: 1.0

    # MPC 数值稳健性: Hessian 自适应对角正则
    # H <- H + eps*I, eps=max(epsilon_abs, epsilon_rel*mean(diag(H)))
    controller.mpc.regularization.enable: true
    controller.mpc.regularization.epsilon_abs: 1e-8
    controller.mpc.regularization.epsilon_rel: 1e-6
    controller.mpc.regularization.epsilon_max: 1e-2
    controller.mpc.regularization.retry_on_fail: true
    controller.mpc.regularization.retry_scale: 10.0

    # MPC 分层诊断: 低成本常开，高成本抽样
    controller.mpc.diagnostics.enable: false
    controller.mpc.diagnostics.low_cost_always: true
    controller.mpc.diagnostics.high_cost_enable: false
    controller.mpc.diagnostics.high_cost_sample_every: 20
    controller.mpc.diagnostics.log_every: 50
    controller.mpc.diagnostics.log_on_failure: true
    controller.mpc.diagnostics.active_tol: 1e-4
    controller.mpc.diagnostics.rank_tol_rel: 1e-9

    # MPC 命中概率权重加权（仅缩放 Q，默认关闭）
    controller.mpc.weighting.enable: false
    controller.mpc.weighting.alpha: 3.0 # 误差与命中概率的权衡参数，越大越重视误差小的轨迹
    controller.mpc.weighting.k_omega: 0.5 # 角速度衰减权重，越大越明显地降低快速转动时的权重
    controller.mpc.weighting.sigma_min: 0.05 # 最小角度不确定性 (rad)，防止过度自信导致权重过大
    controller.mpc.weighting.sigma_max: 0.5 # 最大角度不确定性 (rad)，防止过度不确定导致权重过小
    controller.mpc.weighting.sigma_sys: 0.02 # 系统误差引起的角度不确定性 (rad)，与目标距离成正比
    controller.mpc.weighting.target_size: 0.135 # 目标尺寸 (m)，用于将线速度转换为角度不确定性
    controller.mpc.weighting.delay_s: 0.0 # 额外预测延迟 (秒)，叠加在 controller.mpc.control_delay_s 之上，用于模拟更长的系统延迟对权重的影响
    controller.mpc.weighting.max_w: 6.0 # 权重上限，防止过大权重导致优化数值问题
    controller.mpc.weighting.smooth_alpha: 0.7 # 权重平滑系数，越大越平滑，范围 [0,1]
    controller.mpc.weighting.min_distance: 0.1 # 最小距离 (m)，用于权重计算中的距离归一化，防止过近时权重过大
    controller.mpc.weighting.sigma_beta: 0.3 # 角速度引起的不确定性增量权重，越大越明显地降低快速转动时的权重
    controller.mpc.weighting.gamma: 0.5 # 快速转动时权重衰减调整因子，越大衰减越激烈

    # MPC 轨迹生成前速度 clamp
    # 在轨迹生成之前对目标速度进行限幅，防止极端高速状态导致参考轨迹发散:
    #   center_velocity: 保持方向不变，对速度标量 clamp 到 max_linear_speed
    #   yaw_velocity:    直接 clamp 到 [-max_v_yaw, +max_v_yaw]
    # enable: false 时不做任何处理，行为与原版完全一致
    controller.mpc.vel_clamp.enable: true
    controller.mpc.vel_clamp.max_linear_speed: 1.00   # 线速度标量上限 (m/s)
    controller.mpc.vel_clamp.max_v_yaw: 10.0         # yaw 角速度上限 (rad/s)

    # MPC 延时补偿: 启用后参考轨迹生成考虑 processing_delay + controller_delay + prediction_delay
    # 并对每步迭代补偿子弹飞行时间、选板时考虑延迟后的云台姿态
    # enable_delay_compensation: false 时行为与原版完全一致
    controller.mpc.enable_delay_compensation: true
    controller.mpc.prediction_delay_s: 0.0      # 额外预测延迟 (秒), 叠加在 processing_delay 之上
    controller.mpc.flight_time_iters: 2          # 飞行时间迭代补偿次数
    controller.mpc.max_processing_delay_s: 0.5   # 最大处理延迟 clamp 上限 (秒)
    # yaw 速度前馈等效前瞻时间 (秒): yaw_ff ≈ target_yaw_velocity * k_s
    # k_s=0.0 时禁用，推荐从 0.02~0.08 逐步调参
    # controller.mpc.yaw_feedforward_k_s: 0.0

    # MPC 机动自适应权重衰减（快速机动时提高控制保守性）
    # controller.mpc.maneuver_adapt.enable: false
    # controller.mpc.maneuver_adapt.a_max: 3.0
    # controller.mpc.maneuver_adapt.eta: 0.2
    # controller.mpc.maneuver_adapt.tau: 10.0
    # controller.mpc.maneuver_adapt.r_scale: 10.0

    # MPC FOV 软约束（可限制预测轨迹留在视场内）
    # controller.mpc.fov_constraint.enable: false
    # controller.mpc.fov_constraint.margin: 0.05
    # controller.mpc.fov_constraint.slack_weight: 1000.0
    # controller.mpc.fov_constraint.constraint_steps: 0
    # controller.mpc.fov_constraint.dynamic_margin.enable: false
    # controller.mpc.fov_constraint.dynamic_margin.vel_scale: 0.01
    # controller.mpc.fov_constraint.fallback_fov_yaw: 0.35
    # controller.mpc.fov_constraint.fallback_fov_pitch: 0.26

    # 兼容旧键（Deprecated aliases，建议仅迁移时使用）
    # mpc.control_delay_s: 0.0
    # mpc.enable_delay_compensation: false
    # mpc.prediction_delay_s: 0.0
    # mpc.flight_time_iters: 2
    # mpc.max_processing_delay_s: 0.5

    # ═══════════════════════════════════════════════════════════════
    # Prediction Logger — 预测准确率记录（可选）
    # ═══════════════════════════════════════════════════════════════
    # 启用后会将观测值与 Tracker 后验状态写入 CSV 文件，
    # 供 scripts/analyze_prediction.py 离线分析预测误差。
    logging.enable: false
    logging.output_dir: "/tmp/prediction_logs"
    logging.robot_id_filter: ""      # 只记录指定 robot_id；为空则记录全部
    logging.flush_every_n: 50        # 每 N 行落盘一次，减少 I/O 阻塞

    # ═══════════════════════════════════════════════════════════════
    # Maneuver Detection — 机动检测（基于 UKF NIS + 新息范数）
    # ═══════════════════════════════════════════════════════════════
    # 分 update_type 的组合阈值规则（FPR≤10% 离线分析结果）：
    #   单观测(update_type=1): nis > nis_threshold_single AND innov_norm > innov_norm_threshold_single
    #   双观测(update_type=2): nis > nis_threshold_dual   AND innov_norm > innov_norm_threshold_dual
    # maneuver.enable: true
    # maneuver.nis_threshold_single: 238.807
    # maneuver.nis_threshold_dual: 4132.110
    # maneuver.innov_norm_threshold_single: 0.1279
    # maneuver.innov_norm_threshold_dual: 0.0613

    # ================================================================
    # 全量参数参考（注释版）
    # 下面为代码中声明的所有可配置项参考（含默认值），以注释形式列出并附中文说明。
    # 方便工程调参：把对应行取消注释并修改值即可覆盖默认参数。
    # ================================================================

    # Tracker / TF / 基本设置
    # target_frame: 坐标目标参考框架 (默认: "odom")
    # source_frame: 相机输入帧 (默认: "camera_optical_frame")
    # predict_rate: Tracker 预测频率 (Hz)
    # default_r1 / default_r2: 装甲板半径初始值 (m)
    # default_dza: 装甲板 Z 偏移初始值 (m)
    # tracker_timeout: 检测超时 (s)
    # debug_mode: 启用调试话题与日志
    # enable_oscillation_detection: 启用跟踪抖动检测
    # visualization_frame: 可视化 marker 使用的 frame

    # UKF 参数（估计器）
    # ukf.alpha: UKF 采样参数 alpha (小值更稳定)
    # ukf.beta: UKF beta
    # ukf.kappa: UKF kappa
    # ukf.obs_noise_pos: 位置观测噪声方差 (m^2)
    # ukf.obs_noise_yaw: yaw 观测噪声 (rad)
    # ukf.dual_obs_noise_pos: 双观测模式下位置噪声
    # ukf.dual_obs_noise_yaw: 双观测模式下 yaw 噪声
    # ukf.dual_obs_geometry_noise_scale: 双观测几何噪声缩放
    # ukf.single_obs_update_weight_pos: 单观测时位置更新权重
    # ukf.enable_innovation_gating: 启用创新门限过滤
    # ukf.innovation_gate_chi2_threshold: 创新门限卡方阈值

    # 运动模型
    # motion.translation_model: "CV" | "CA" | "Singer" 等
    # motion.cv_process_noise_vel: CV 模型过程噪声 (速度)
    # motion.ca_process_noise_acc: CA 模型过程噪声 (加速度)
    # motion.singer_alpha: Singer 模型 alpha
    # motion.singer_sigma: Singer 模型 sigma
    # motion.process_noise_r: 位置过程噪声
    # motion.process_noise_dz: 高度过程噪声

    # Spin / 旋转模型相关过程噪声
    # spin.spin_process_noise_yaw_rate
    # spin.spin_process_noise_yaw_acc
    # spin.spin_process_noise_delta_rate
    # spin.spin_process_noise_delta_acc

    # 熵与多目标相关
    # entropy.temperature: 选择器温度参数 (softmax 温度)
    # entropy.use_adaptive: 是否启用自适应温度
    # entropy.k_prior_weight: 先验权重

    # Tracker 行为阈值
    # tracker.tracking_thres: 跟踪阈值（计数）
    # tracker.lost_thres: 丢失阈值（计数）
    # tracker.temp_lost_thres: 临时丢失阈值
    # tracker.max_match_distance: 匹配最大距离 (m)
    # tracker.max_match_yaw_diff: 匹配最大 yaw 差 (rad)
    # tracker.n_panels: 装甲板数
    # tracker.panel_angle_step: 装甲板角度步长 (rad)

    # Constraints / 约束
    # constraints.min_radius / max_radius: 目标半径限制 (m)
    # constraints.min_dz / max_dz: 高度差限制 (m)

    # Panel mismatch 检测
    # panel_mismatch.enable: 启用板匹配不一致检测
    # panel_mismatch.window_size: 滑动窗口大小
    # panel_mismatch.threshold_t1: 阈值 t1
    # panel_mismatch.confirm_count: 确认次数
    # panel_mismatch.reinit_count: 重新初始化次数

    # 输出平滑器（Smoother）参数
    # smoother.enable: 总开关
    # smoother.enable_position_smooth: 位置平滑开关
    # smoother.enable_yaw_smooth: yaw 平滑开关
    # smoother.enable_velocity_smooth: 速度平滑开关
    # smoother.enable_structural_convergence: 结构收敛开关
    # smoother.pos_min_cutoff / pos_beta / pos_d_cutoff: 位置 One-Euro 参数
    # smoother.yaw_min_cutoff / yaw_beta / yaw_d_cutoff: yaw One-Euro 参数
    # smoother.vel_min_cutoff / vel_beta / vel_d_cutoff: 速度 One-Euro 参数
    # smoother.rm_initial_step / rm_gamma / rm_n0: Robbins-Monro 参数
    # smoother.rm_dual_obs_boost: 双观测时的增益
    # smoother.rm_min_radius / rm_max_radius: RM 作用的半径范围
    # smoother.rm_min_dz / rm_max_dz: RM 作用的高度范围
    # smoother.rm_convergence_eps: RM 收敛阈值
    # smoother.default_freq: 平滑器默认频率 (Hz)
    # smoother.enable_outlier_filter: 是否启用外点检测
    # smoother.outlier_method: mad | iqr | mahalanobis
    # smoother.outlier_window_size: 外点检测窗口
    # smoother.outlier_min_samples: 最小样本数
    # smoother.outlier_mad_k / outlier_iqr_k / outlier_mahal_threshold: 外点阈值

    # Target selector 选择策略参数
    # selector.strategy: 选择策略名称
    # selector.reference_yaw: 参考 yaw
    # selector.max_yaw_deviation: 最大偏差
    # selector.max_distance: 最大考虑距离
    # selector.min_confidence: 最低置信度
    # selector.hysteresis_threshold: 选择滞后阈值
    # selector.priority_robot_ids: 优先 robot id 列表
    # selector.sticky_lock_frames / sticky_lost_frames: sticky 策略帧数

    # 控制器通用设置
    # controller.bullet_speed: 子弹速度 (m/s)
    # controller.control_rate: 控制频率 (Hz)
    # controller.strategy: 控制策略 (current | predicted | mpc | state_machine)
    # controller.ballistic_mode: 弹道求解方式 (service | local)

    # Solver / 目标选择与弹道解算相关参数
    # controller.solver.shooting_range_width/height: 允许射击的误差范围 (rad)
    # controller.solver.side_angle: 侧面角阈值 (deg)
    # controller.solver.min_switching_v_yaw: 切换最小 yaw 速度阈值
    # controller.solver.prediction_delay: 预测延迟 (s)
    # controller.solver.max_prediction_time: 预测最大时间 (s)
    # controller.solver.max_tracking_v_yaw: 最大跟踪 yaw 速度 (rad/s)
    # controller.solver.transfer_thresh: 切换阈值
    # controller.solver.gravity: 重力加速度 (m/s^2)
    # controller.solver.resistance: 阻力系数
    # controller.solver.iteration_times: 迭代次数
    # controller.solver.pitch_offset / yaw_offset: 云台偏移补偿 (rad)
    # controller.solver.facing_enter_angle / facing_exit_angle: 朝向判定角 (deg)
    # controller.solver.radial_dynamic.*: 径向动态选板参数
    # controller.solver.controller_delay: 额外 controller delay (s)
    # controller.solver.selection_method: 选板方法名称

    # Controller adaptive delay (AIMD)
    # controller.solver.adaptive_delay.enable
    # controller.solver.adaptive_delay.fire_wait_threshold
    # controller.solver.adaptive_delay.mul_factor
    # controller.solver.adaptive_delay.add_step
    # controller.solver.adaptive_delay.max_delay / min_delay
    # controller.solver.adaptive_delay.max_linear_speed / max_angular_speed

    # State machine 参数
    # controller.state_machine.facing_enter_angle / facing_exit_angle
    # controller.state_machine.spin_v_yaw_thresh / calm_v_yaw_thresh
    # controller.state_machine.spin_enter_count / spin_exit_count
    # controller.state_machine.side_angle
    # controller.state_machine.prediction_delay / max_prediction_time

    # MPC 相关参数
    # controller.mpc.N: 预测步数
    # controller.mpc.dt: 时间步长 (s)
    # controller.mpc.control_delay_s: 控制延时 (s)
    # controller.mpc.max_accel: 最大角加速度 (rad/s^2)
    # controller.mpc.q_* / r_* / s_*: Q,R,S 矩阵基准值
    # controller.mpc.normalization.enable: 归一化总开关
    # controller.mpc.normalization.mode: "rms" | "typical"
    # controller.mpc.normalization.window_size / min_samples / rms_epsilon: rms 模式参数
    # controller.mpc.normalization.typical_state.*: typical 模式下状态典型值
    # controller.mpc.normalization.typical_control.*: typical 模式下控制量典型值
    # controller.mpc.normalization.typical_delta_control.*: typical 模式下控制增量典型值
    # controller.mpc.enable_delay_compensation: 启用延迟补偿参考轨迹
    # controller.mpc.prediction_delay_s: 额外预测延迟
    # controller.mpc.flight_time_iters: 子弹飞行时间迭代次数
    # controller.mpc.max_processing_delay_s: processing_delay 上限
    # controller.mpc.yaw_feedforward_k_s: yaw 前馈等效时间 (s)

    # Maneuver-adaptive MPC
    # controller.mpc.maneuver_adapt.enable
    # controller.mpc.maneuver_adapt.a_max
    # controller.mpc.maneuver_adapt.eta
    # controller.mpc.maneuver_adapt.tau
    # controller.mpc.maneuver_adapt.r_scale

    # MPC 权重加权（命中概率引导, 仅缩放 Q）
    # controller.mpc.weighting.enable: 是否启用
    # controller.mpc.weighting.alpha: 缩放幅度 α
    # controller.mpc.weighting.k_omega: 角速度惩罚系数
    # controller.mpc.weighting.sigma_min / sigma_max / sigma_sys
