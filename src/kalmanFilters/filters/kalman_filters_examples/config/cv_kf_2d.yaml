# 2D Constant Velocity Kalman Filter Configuration
# 2维恒定速度卡尔曼滤波器配置

filter:
  type: "CV_KF"
  
  T: 0.01
  Dim: 2
  
  # Measurement noise covariance matrix R (2x2)
  R:
    - [0.01, 0.0]
    - [0.0, 0.01]
  
  # Initial state vector [x, vx, y, vy]
  X_0: [0.0, 0.0, 0.0, 0.0]
  
  process_noise_std: 0.1
