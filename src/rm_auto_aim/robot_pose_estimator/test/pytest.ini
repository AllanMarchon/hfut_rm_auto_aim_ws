[pytest]
markers =
    integration: marks tests as integration tests (require running nodes)
    pipeline: marks tests as full pipeline tests (require both armor_tracker and robot_pose_estimator)

testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default timeout for all tests
timeout = 60

# Show extra test summary info
addopts = -v --tb=short

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
